            record('已核查产品测试技能输入未变化',not changed,{'文件数':len(before),'变化':changed})
            m=load(base/'resume-package-manifest.json')
            pub=Path((base/'resume-publish-directory.txt').read_text(encoding='utf-8-sig').strip())
            exe=Path(m['executable'])
            exe_hash=digest(exe)
            record('发布目录和可执行文件清单一致',pub==Path(m['packageDirectory']) and exe.parent==pub and exe.stat().st_size==m['sizeBytes'] and exe_hash==m['sha256'].upper(),{'目录':str(pub),'字节数':exe.stat().st_size,'SHA256':exe_hash})
            source_guide=root/'skills/app-guide/SKILL.md'
            published_guide=pub/'skills/app-guide/SKILL.md'
            guide_hash=digest(source_guide)
            record('发布包技能与本轮源码一致',guide_hash==digest(published_guide)==m['appGuideSha256'].upper(),{'源码SHA256':guide_hash,'发布技能':str(published_guide)})
