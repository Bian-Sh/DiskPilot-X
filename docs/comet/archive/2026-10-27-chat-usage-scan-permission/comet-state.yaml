            def load(path): return json.loads(path.read_text(encoding='utf-8-sig'))
            def digest(path):
             return hashlib.sha256(path.read_bytes()).hexdigest().upper()
            checks=[]
            def record(name,passed,detail): checks.append({'名称':name,'通过':bool(passed),'证据':detail})
            d=load(base/'resume-verifier-dispatch.json')
            s=load(root/'.comet/runtime/native/changes/chat-usage-scan-permission/state.json')
            record('当前候选工作区与历史证据位置一致',bool(s.get('candidateId')) and Path(d['verificationRoot']).resolve()==root.resolve(),{'当前候选':s['candidateId'],'历史证据候选':d['candidateId'],'工作目录':str(root),'说明':'Runtime 将本次检查收据绑定到当前候选；下面另校验历史输入基线全部文件哈希，不能把历史派发ID当作新候选ID。'})
            before=load(base/'independent-verifier-resume-inputs-before.json')['sha256']
            changed=[p for p,h in before.items() if not (root/p).is_file() or digest(root/p).lower()!=h.lower()]
            record('已核查产品测试技能输入未变化',not changed,{'文件数':len(before),'变化':changed})
            m=load(base/'resume-package-manifest.json')
            pub=Path((base/'resume-publish-directory.txt').read_text(encoding='utf-8-sig').strip())
            exe=Path(m['executable'])
            exe_hash=digest(exe)
            record('发布目录和可执行文件清单一致',pub==Path(m['packageDirectory']) and exe.parent==pub and exe.stat().st_size==m['sizeBytes'] and exe_hash==m['sha256'].upper(),{'目录':str(pub),'字节数':exe.stat().st_size,'SHA256':exe_hash})
            source_guide=root/'skills/app-guide/SKILL.md'
            published_guide=pub/'skills/app-guide/SKILL.md'
            guide_hash=digest(source_guide)
            record('发布包技能与本轮源码一致',guide_hash==digest(published_guide)==m['appGuideSha256'].upper(),{'源码SHA256':guide_hash,'发布技能':str(published_guide)})
            xaml_path=root/'src/DiskPilotX.App/Views/ChatPanel.xaml'
            xaml=ET.parse(xaml_path)
            ns={'p':'http://schemas.microsoft.com/winfx/2006/xaml/presentation'}
            xt='{http://schemas.microsoft.com/winfx/2006/xaml}Name'
            badge=next(n for n in xaml.iter() if n.get(xt)=='UsageBadge')
            tip=badge.find('p:Border.ToolTip/p:ToolTip',ns)
            content=tip.find('p:StackPanel',ns)
            record('popup内容为230DIP且移除公式',content.get('Width')=='230' and '命中率 =' not in ET.tostring(tip,encoding='unicode'),{'内容宽度DIP':content.get('Width'),'来源':str(xaml_path)})
            record('popup仍绑定统计数值',any(n.get('ItemsSource')=='{Binding UsageDetails}' for n in content.iter()),'UsageDetails 包含缓存命中率、输入输出等数值；实际打开证据复用本轮 App Runtime 检查。')
            guide=source_guide.read_text(encoding='utf-8')
            required=['缓存命中率 = 缓存读取 / 总输入（含缓存）','input_tokens + cache_read_input_tokens + cache_creation_input_tokens','不是各次百分比的平均值','仅在用户询问模型、token 或缓存时解释']
            record('算法转入按需解释的APP引导skill',all(x in guide for x in required),{'已核对文字':required})
            u=load(base/'resume-ui/model-usage.json')
            p=load(base/'resume-ui-process.json')
            record('窗口证据与新包记录绑定',u['pid']==p['pid'] and u['window_id']==p['windowId'] and Path(p['exe'])==exe and 'fixture-model-b-actual' in u['tree_markdown'] and '120 tokens' in u['tree_markdown'],{'pid':u['pid'],'windowId':u['window_id'],'模型':'fixture-model-b-actual','token':'[REDACTED]','说明':'只读取已有记录，不枚举或接触进程。'})
            png=base/'resume-ui/model-usage.png'
            with png.open('rb') as f: header=f.read(24)
            w,h=struct.unpack('>II',header[16:24])
            record('现有截图为应用窗口尺寸',header[:8]==b'\x89PNG\r\n\x1a\n' and w==u['screenshot_width'] and h==u['screenshot_height'],{'尺寸':[w,h],'SHA256':digest(png),'说明':'模型与token窗口截图，不是发布包popup截图。'})
            rc=load(root/'src/DiskPilotX.App/bin/Release/net10.0-windows/win-x64/DiskPilot-X.runtimeconfig.json')['runtimeOptions']
            frameworks=[x['name'] for x in rc.get('includedFrameworks',[])]
            record('发布构建具有自包含运行时配置','Microsoft.NETCore.App' in frameworks and 'Microsoft.WindowsDesktop.App' in frameworks,{'includedFrameworks':rc.get('includedFrameworks'),'说明':'结合单文件exe清单和发布日志；本轮不启动程序。'})
            report={'说明':'独立 Verifier 经 Comet Runtime 执行的只读补充检查。没有运行全量测试、GUI、付费模型或扫描。','时间':datetime.datetime.now().astimezone().isoformat(),'candidateId':s['candidateId'],'checks':checks,'通过数':sum(x['通过'] for x in checks),'总数':len(checks)}
            out=base/'merge-package-final-2.json'
            with out.open('w',encoding='utf-8') as f: json.dump(report,f,ensure_ascii=False,indent=2)
            print(json.dumps(report,ensure_ascii=False))
            raise SystemExit(0 if all(x['通过'] for x in checks) else 1)
