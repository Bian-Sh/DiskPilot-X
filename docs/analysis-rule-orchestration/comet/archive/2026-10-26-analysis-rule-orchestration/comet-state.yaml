        优先级及版本变化回归已纳入本候选正式测试。
      truncated: false
  - id: A3
    source: brief.md
    text: 适用线索不等于可删除：目录名与后缀相同的构建产物和运行组件，经内容及排除条件核实得到不同判断；无元数据的旧规则有兼容路径。
